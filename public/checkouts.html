<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
    <header>
        <h1>Checkout</h1>
    </header>

    <main>
        <section class="order-summary">
            <h2>Order Summary</h2>
            <div id="order-items"></div>
            <div class="total">
                <p>50LE Shipping Fees are added</p>
                <p>Total: <span id="order-total">0.00 LE</span></p>
            </div>
        </section>

        <section class="payment-info">
            <h2>Payment Information</h2>
            <!-- <form>
                https://script.google.com/macros/s/AKfycby5zxnBCBehRF_Ik9M5wRGMw0JC_FHQVpZjizFY8uh33cZeej_BHe1YO7kL5z5EOTO7/exec
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <button type="submit">Place Order</button>
            </form> -->
            <form method="POST" action="/submit">
                <label for="name">Name:</label>
                <input type="text" id="name" name="customerName" required>
            
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            
                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required>
            
                <input type="hidden" name="productName" value="Product Name">
                <input type="hidden" name="size" value="M">
                <input type="hidden" name="quantity" value="1">
                <input type="hidden" name="price" value="325.00">
                <input type="hidden" name="total" value="325.00">
            
                <button type="submit" id="submit">Place Order</button>
            </form>
            




        </section>
    </main>

    <footer>
        <p>&copy; 2024 Your Brand. All rights reserved.</p>
    </footer>

    <script defer src="js/checkout.js"></script>
</body>
</html>
