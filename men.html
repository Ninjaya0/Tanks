            <a href="cart"><img src="images/cart.png" alt="Cart" class="cart-icon"> <span id="cart-count"></span></a>

            <a href="#" class="menu-icon">☰</a>
        </nav>
    </header>

    <div id="side-menu" class="side-menu">

    <!-- awel sura -->
    <div class="product-card">
        <img src="images/tank.jpg" alt="Emerald Ribbed Tank Top">
        <p class="product-name">TANK TOP (EMERALD)</p>
        <p class="product-price">325.00 LE</p>
        <div class="product-options">
            <label for="size-select">Size:</label>
            <select class="size-select" name="size" id="size-select">
                <option value="S">Small</option>
                <option value="M">Medium</option>
                <option value="L">Large</option>
            </select>
        </div>

        <div class="quantity-selector">
            <button class="quantity-btn decrease">-</button>
            <input type="number" class="quantity-input" value="1" min="1">
            <button class="quantity-btn increase">+</button>
        </div>
        <button class="add-to-cart-btn" data-product-name="TANK TOP (EMERALD)" data-product-price="325.00 LE">Add to cart</button>
        <button class="buy-now-btn" data-product-name="TANK TOP (EMERALD)" data-product-price="325.00 LE">Buy it now</button>
    </div>
