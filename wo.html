<!-- awel -->

    <div class="product-card">
        
        <div class="slider" id="slider1">
            <img src="images/womenwhite1.jpeg" alt="White Crewneck Tank Top" class="active">
            <img src="images/womenwhite2.jpeg" alt="White Crewneck Tank Top">
            <img src="images/womenwhite3.jpeg" alt="White Crewneck Tank Top">
            <img src="images/womenwhite4.jpeg" alt="White Crewneck Tank Top">
            
            <button class="prev" onclick="prevSlide(1)">❮</button>
            <button class="next" onclick="nextSlide(1)">❯</button>
        </div>


        <p class="product-name">White Crewneck Tank Top</p>


        <p class="product-price">
            <span class="old-price">385.00 LE</span> 
            <span class="discount-label">15% off</span>
            <span class="new-price">335.00 LE</span>
        </p>
        

        <div class="product-options">
            <label for="size-select">Size:</label>
            <select class="size-select" name="size" id="size-select">
                <option value="XS">X-Small</option> 
                <option value="S">Small</option>
                <option value="M">Medium</option>
                <option value="L">Large</option>
            </select>




            
            <button class="size-chart-btn">Size Chart</button> <!-- Add the Size Chart button -->
            <div class="size-chart-container">
                <img src="images/womensziechat.jpeg" alt="Size Chart" class="size-chart" style="display: none;">
            </div>
            </select>
        </div>
        <div class="quantity-selector">
            <button class="quantity-btn decrease">-</button>
            <input type="number" class="quantity-input" value="1" min="1">
            <button class="quantity-btn increase">+</button>
        </div>
        <button class="add-to-cart-btn" data-product-name="TANK TOP (EMERALD)" data-product-price="335.00 LE">Add to cart</button>
        <button class="buy-now-btn" data-product-name="TANK TOP (EMERALD)" data-product-price="335.00 LE">Buy it now</button>
    </div>
