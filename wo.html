<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="css/wo.css">
</head>
<body>
    <header>
        <h1>women</h1>
        <nav>
            <a href="cart"><img src="images/cart.png" alt="Cart"></a>
            <a href="#" class="menu-icon">☰</a>
        </nav>
    </header>

    <div id="side-menu" class="side-menu">
        <a href="#" class="close-btn">&times;</a>
        <a href="/">HOME</a>
        <a href="men">Men shop</a>
        <a href="women">Women shop</a>
        <!-- <a href="#">SUMMER SWEATPANTS</a>
        <a href="#">CARGOS</a>
        <a href="#">HOODIES</a>
        <a href="#">CREWNECKS</a> -->
    </div>

    <div class="product-grid">
        <div class="product-card">
            <img src="images/tank.jpg" alt="Emerald Ribbed Tank Top">
            <p class="product-name">TANK TOP (EMERALD)</p>
            <p class="product-price">325.00 LE</p>
        </div>
        <div class="product-card">
            <img src="images/tank3.png" alt="Black Ribbed Tank Top">
            <p class="product-name">TANK TOP (BLACK)</p>
            <p class="product-price">325.00 LE</p>
        </div>
        <div class="product-card">
            <img src="images/tank3.png" alt="Vanilla Ribbed Tank Top">
            <p class="product-name">TANK TOP (VANILLA)</p>
            <p class="product-price">325.00 LE</p>
        </div>
        <div class="product-card">
            <img src="images/tank.jpg" alt="Navy Ribbed Tank Top">
            <p class="product-name">Tank Top (NAVY)</p>
            <p class="product-price">325.00 LE</p>
        </div>
    </div>
    <script src="js/wo.js"></script>
</body>
</html>
